name: It booted
description: Tell us it works on your MPC Sample (or what was odd about it)
title: "It booted: "
labels: ["it-booted"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing. Every unit and card is different, so a report of what worked helps. If something failed to boot or broke, use **Report a problem** instead.
  - type: input
    id: firmware
    attributes:
      label: MPC Sample firmware version
      placeholder: "1.3.0.12"
    validations:
      required: true
  - type: input
    id: sampqol
    attributes:
      label: SampQOL version
      placeholder: "0.2.0"
    validations:
      required: true
  - type: input
    id: kit
    attributes:
      label: Kit version, commit or release
      placeholder: "v0.7.1"
    validations:
      required: true
  - type: dropdown
    id: method
    attributes:
      label: Install method
      options:
        - Online installer
        - HS Tools card
        - SampleBoot (autorun/mods)
        - Boot Thingy zip
    validations:
      required: true
  - type: textarea
    id: works
    attributes:
      label: What works
      description: Effects, pages or features you tried that did what they should.
    validations:
      required: true
  - type: textarea
    id: odd
    attributes:
      label: Anything odd
      description: Glitches, slow screens, things that looked different from the guide. A photo of the screen helps. Write "nothing" if all good.

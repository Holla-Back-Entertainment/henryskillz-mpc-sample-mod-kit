name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m unittest discover -s tests -v
      - run: node installer/test_installer.mjs
      - name: Build and check LADSPA registry
        working-directory: src/fx
        run: |
          gcc -O2 -Wall -Wextra -Werror -I. -DHS_MPC_LADSPA_RECALL \
            check-registry.c hs_ladspa.c hs_registry.c hs_eq2.c hs_pump.c hs_heat.c \
            hs_distressor.c hs_bass_focus.c hs_tube_strip.c hs_bus.c hs_xsat.c \
            hs_channel.c hs_saturator.c hs_air_exciter.c hs_env.c \
            -o /tmp/check-registry -lm -pthread
          /tmp/check-registry
      - name: Every factory preset names real controls, inside their ranges
        working-directory: src/fx
        run: |
          gcc -O2 -I. -DHS_MPC_LADSPA_RECALL gen-factory.c hs_ladspa.c hs_registry.c hs_eq2.c hs_pump.c hs_heat.c \
            hs_distressor.c hs_bass_focus.c hs_tube_strip.c hs_bus.c hs_xsat.c hs_channel.c hs_saturator.c \
            hs_air_exciter.c hs_env.c -o /tmp/gen-factory -lm -pthread
          /tmp/gen-factory > /dev/null
